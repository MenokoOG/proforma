name: Feature request
description: Suggest something ProForma should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Two constraints worth knowing before you write this up, because they
        shape what can be accepted:

        - **No new runtime dependencies.** The bundle is under 120 kB gzipped
          and CI enforces it.
        - **The calculation engine is verified against a source workbook.**
          Anything that changes a number needs to be argued on its own terms.
          That is not a no — it is a longer conversation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution. What were you trying to get done?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like ProForma to do?
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - A new input or line item
        - A new calculation or output figure
        - A change to an existing calculation
        - A new export format
        - Interface, layout or accessibility
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
      description: A workaround, a spreadsheet, or nothing. Helps size how much this matters.

  - type: textarea
    id: sources
    attributes:
      label: If this involves a financial method, where is it defined?
      description: >
        For anything touching the arithmetic, a reference makes the difference
        between a discussion and a decision. A textbook, a standard, or the
        source framework are all fine.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the two constraints above.
          required: true
