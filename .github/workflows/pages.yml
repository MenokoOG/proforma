name: Deploy to GitHub Pages

# Manual only, for now.
#
# GitHub Pages is available on public repositories with GitHub Free, and on
# private repositories only with Pro, Team or Enterprise. This repository is
# private until the source-material permission recorded in NOTICE is settled,
# so a push-triggered deploy would fail on every merge to main and train us to
# ignore a red Actions tab.
#
# When the repository goes public: restore the push trigger below, enable
# Pages under Settings -> Pages with Source set to "GitHub Actions", and put
# the demo link back in the README header and the homepage field in
# package.json.
#
# on:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Project pages are served from /<repo>/, so the app is built with a
      # matching base. Local builds keep '/' — see vite.config.ts.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Client-side routing: an unknown path must return index.html rather
      # than a 404. Pages honours a copy named 404.html.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
